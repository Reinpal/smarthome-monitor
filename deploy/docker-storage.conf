# Installed at /etc/systemd/system/docker.service.d/smarthome-storage.conf
# Applies to ALL Docker containers on this Pi, including automatic restarts.
[Unit]
RequiresMountsFor=/mnt/external/smarthome-data
BindsTo=mnt-external.mount
After=mnt-external.mount

[Service]
ExecStartPre=/usr/local/sbin/check-smarthome-storage
